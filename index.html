<script>
const questions = [{"num": 1, "section": "Penicillins — Structure", "question": "What are the three structural components of penicillins?", "options": ["A. β-lactam ring + Thiazolidine ring + R side chain", "B. β-lactam ring + Amino group + Hydroxyl group", "C. Thiazolidine ring + Pyrimidine ring + R side chain", "D. β-lactam ring + Imidazole ring + R side chain"], "correct": "A", "explanation": "Penicillins consist of a core β-lactam ring fused to a thiazolidine ring, with an R side chain that affects spectrum, stability, resistance, and absorption."}, {"num": 2, "section": "Penicillins — Mechanism", "question": "What is the mechanism of action of penicillins?", "options": ["A. Inhibit protein synthesis at the 50S ribosome", "B. Inhibit transpeptidation (cross-linking of peptidoglycan) by binding to PBPs", "C. Inhibit DNA gyrase", "D. Block folic acid synthesis"], "correct": "B", "explanation": "Penicillins bind to penicillin-binding proteins (PBPs), inhibiting transpeptidation and preventing peptidoglycan cross-linking, leading to cell wall weakening and bacterial death."}, {"num": 3, "section": "Penicillins — Classification", "question": "Penicillins are classified as which type of antibiotic based on their killing mechanism?", "options": ["A. Bacteriostatic and concentration-dependent", "B. Bactericidal and time-dependent", "C. Bacteriostatic and time-dependent", "D. Bactericidal and concentration-dependent"], "correct": "B", "explanation": "Penicillins are bactericidal (kill bacteria) and work in a time-dependent fashion (efficacy depends on time drug concentration remains above MIC)."}, {"num": 4, "section": "Natural Penicillins", "question": "Which of the following is TRUE about Penicillin G vs Penicillin V?", "options": ["A. Penicillin G is oral; Penicillin V is parenteral", "B. Penicillin G is acid-stable; Penicillin V is not", "C. Penicillin V is acid-stable and can be taken orally; Penicillin G is unstable in acid", "D. Both are equally well absorbed orally"], "correct": "C", "explanation": "Penicillin V is acid-stable and suitable for oral use; Penicillin G is unstable in gastric acid and must be given parenterally (IV/IM)."}, {"num": 5, "section": "Natural Penicillins — Clinical Uses", "question": "Despite resistance, penicillin remains the drug of choice for which infections?", "options": ["A. TB and Leprosy", "B. Gas gangrene (Clostridium perfringens) and Syphilis (Treponema pallidum)", "C. Malaria and Fungal infections", "D. Viral infections"], "correct": "B", "explanation": "Penicillin remains the drug of choice for gas gangrene (Clostridium perfringens) and syphilis (Treponema pallidum)."}, {"num": 6, "section": "Aminopenicillins", "question": "Ampicillin and Amoxicillin are classified as aminopenicillins because they:", "options": ["A. Are derived from aminoglycosides", "B. Have an amino group attached to the 6-aminopenicillanic acid nucleus, extending activity to Gram-negative bacteria", "C. Are only effective against Gram-positive bacteria", "D. Are resistant to all β-lactamases"], "correct": "B", "explanation": "Aminopenicillins are chemically modified by attaching amino groups to the 6-APA nucleus, extending antimicrobial activity to Gram-negative bacteria."}, {"num": 7, "section": "Aminopenicillins — Clinical Uses", "question": "Which is the drug of choice for Listeria monocytogenes?", "options": ["A. Cephalexin", "B. Ampicillin (often combined with gentamicin)", "C. Azithromycin", "D. Vancomycin"], "correct": "B", "explanation": "Ampicillin is the drug of choice for Listeria monocytogenes, often combined with gentamicin for synergistic effect."}, {"num": 8, "section": "β-Lactamase Inhibitor Combinations", "question": "Which combination is used to overcome β-lactamase resistance?", "options": ["A. Amoxicillin + Clavulanic acid", "B. Amoxicillin + Metronidazole", "C. Penicillin V + Probenecid", "D. Ampicillin + Aspirin"], "correct": "A", "explanation": "Amoxicillin + Clavulanic acid (and Ampicillin + Sulbactam) are common β-lactamase inhibitor combinations that overcome resistance from β-lactamase-producing bacteria."}, {"num": 9, "section": "Antistaphylococcal Penicillins", "question": "Which penicillins are β-lactamase-resistant and used against MSSA?", "options": ["A. Amoxicillin and Ampicillin", "B. Methicillin, Nafcillin, Oxacillin, and Dicloxacillin", "C. Piperacillin and Ticarcillin", "D. Penicillin G and Penicillin V"], "correct": "B", "explanation": "Methicillin, nafcillin, oxacillin, and dicloxacillin are β-lactamase-resistant penicillins restricted to treating infections caused by penicillinase-producing staphylococci, including MSSA."}, {"num": 10, "section": "Antipseudomonal Penicillins", "question": "Piperacillin is co-formulated with which β-lactamase inhibitor?", "options": ["A. Clavulanic acid", "B. Sulbactam", "C. Tazobactam", "D. Avibactam"], "correct": "C", "explanation": "Piperacillin is often co-formulated with tazobactam to combat penicillinase-producing bacteria, expanding coverage to β-lactamase-producing Gram-negative organisms."}, {"num": 11, "section": "Resistance to Penicillins", "question": "Which is the MOST COMMON mechanism of resistance to penicillins?", "options": ["A. Altered PBPs", "B. Decreased permeability (porin loss)", "C. β-Lactamase production", "D. Efflux pumps"], "correct": "C", "explanation": "β-Lactamase production is the most common resistance mechanism; bacteria produce enzymes that break down β-lactam antibiotics."}, {"num": 12, "section": "Penicillin Pharmacokinetics — Absorption", "question": "Which penicillin has the best oral absorption?", "options": ["A. Penicillin G", "B. Penicillin V (only one-third absorbed)", "C. Amoxicillin (acid-stable, well absorbed)", "D. Nafcillin"], "correct": "C", "explanation": "Amoxicillin is stable in acid and well absorbed orally. Penicillin V has only one-third absorption; Penicillin G is poorly absorbed orally."}, {"num": 13, "section": "Penicillin Pharmacokinetics — Distribution", "question": "Which statement about penicillin distribution is CORRECT?", "options": ["A. Excellent CSF penetration even without meningitis", "B. Good prostate penetration (effective for prostatitis)", "C. Crosses the placenta but is not teratogenic; limited CSF penetration unless inflamed", "D. Does not cross the placenta at all"], "correct": "C", "explanation": "Penicillins cross the placenta but are not teratogenic. They have limited CSF penetration unless meningitis is present, and poor prostate penetration."}, {"num": 14, "section": "Penicillin — Adverse Effects", "question": "About 10% of patients report penicillin allergy. What is TRUE about this?", "options": ["A. 90% of these patients have true IgE-mediated allergy", "B. Symptoms range from rash to anaphylaxis; 90% do NOT have true IgE-mediated allergy", "C. Only causes anaphylaxis in all patients", "D. Never causes cross-reactivity with cephalosporins"], "correct": "B", "explanation": "Symptoms range from rash to anaphylaxis, but 90% of patients reporting penicillin allergy do NOT have true IgE-mediated allergy. Cross-reactivity with cephalosporins is possible."}, {"num": 15, "section": "Penicillin — Adverse Effects (Neurotoxicity)", "question": "High doses of penicillins can cause seizures because they:", "options": ["A. Stimulate dopamine receptors", "B. Inhibit GABA, leading to CNS excitation", "C. Block serotonin reuptake", "D. Activate NMDA receptors"], "correct": "B", "explanation": "High doses of penicillins can inhibit GABA, leading to CNS excitation and seizures, especially in epileptic patients."}, {"num": 16, "section": "Penicillin — Nephritis", "question": "Which penicillin is associated with Acute Interstitial Nephritis (AIN)?", "options": ["A. Amoxicillin", "B. Penicillin V", "C. Methicillin", "D. Dicloxacillin"], "correct": "C", "explanation": "Methicillin is associated with Acute Interstitial Nephritis (AIN). Methicillin is no longer used clinically due to this risk."}, {"num": 17, "section": "Penicillin — Hematologic", "question": "Which adverse effect is associated with long-term therapy (>2 weeks) of penicillins like Piperacillin and Nafcillin?", "options": ["A. Hypertension", "B. Cytopenias (monitor blood counts weekly)", "C. Hyperglycemia", "D. Renal calculi"], "correct": "B", "explanation": "Long-term therapy (>2 weeks) with high doses of Piperacillin & Nafcillin can cause cytopenias; blood counts should be monitored weekly."}, {"num": 18, "section": "Penicillin — Probenecid Interaction", "question": "What is the effect of Probenecid when given with penicillins?", "options": ["A. Decreases penicillin blood levels by increasing renal excretion", "B. Inhibits tubular secretion, increasing penicillin blood levels", "C. Has no effect on penicillin pharmacokinetics", "D. Enhances the antibacterial spectrum"], "correct": "B", "explanation": "Probenecid inhibits tubular secretion of penicillins, thereby increasing and prolonging their blood levels."}, {"num": 19, "section": "Cephalosporins — Overview", "question": "Cephalosporins are classified into how many generations?", "options": ["A. 3", "B. 4", "C. 5", "D. 6"], "correct": "C", "explanation": "Cephalosporins are classified into five generations based on bacterial susceptibility patterns and resistance to β-lactamases."}, {"num": 20, "section": "Cephalosporins — Overview", "question": "Which organisms are NOT covered by cephalosporins?", "options": ["A. Gram-positive cocci", "B. Gram-negative rods", "C. Listeria monocytogenes, Clostridium difficile, and Enterococci", "D. Staphylococcus aureus"], "correct": "C", "explanation": "Cephalosporins do not cover Listeria monocytogenes, Clostridium difficile, or enterococci."}, {"num": 21, "section": "1st Generation Cephalosporins", "question": "Cefazolin (1st generation) is commonly used for:", "options": ["A. Meningitis", "B. Surgical prophylaxis", "C. TB treatment", "D. Viral infections"], "correct": "B", "explanation": "Cefazolin (1st generation) is commonly used for surgical prophylaxis. Cephalexin is used for uncomplicated skin and soft tissue infections."}, {"num": 22, "section": "1st Generation Cephalosporins", "question": "1st generation cephalosporins cover which Gram-negative organisms?", "options": ["A. Pseudomonas aeruginosa", "B. PEK organisms (Proteus mirabilis, E. coli, Klebsiella pneumoniae)", "C. Neisseria gonorrhoeae only", "D. All Gram-negative bacteria"], "correct": "B", "explanation": "1st generation cephalosporins have limited Gram-negative coverage, primarily covering PEK organisms (Proteus mirabilis, E. coli, Klebsiella pneumoniae)."}, {"num": 23, "section": "2nd Generation Cephalosporins", "question": "Which cephalosporin is preferred for upper respiratory infections (sinusitis, otitis media)?", "options": ["A. Cefazolin", "B. Cefuroxime", "C. Ceftriaxone", "D. Ceftazidime"], "correct": "B", "explanation": "Cefuroxime (2nd generation) is preferred for upper respiratory infections such as sinusitis and otitis media."}, {"num": 24, "section": "2nd Generation Cephalosporins", "question": "Cefotetan and Cefoxitin (2nd generation) are special because they:", "options": ["A. Cover anaerobes including Bacteroides fragilis", "B. Are effective against MRSA", "C. Are the only oral cephalosporins", "D. Have no Gram-negative activity"], "correct": "A", "explanation": "Cefotetan and Cefoxitin are cephamycins that cover anaerobes, including Bacteroides fragilis, and are used for intra-abdominal and pelvic infections."}, {"num": 25, "section": "3rd Generation Cephalosporins", "question": "Ceftriaxone and Cefotaxime (3rd generation) are first-line for which infection?", "options": ["A. Skin infections", "B. Bacterial meningitis", "C. UTI only", "D. TB"], "correct": "B", "explanation": "Ceftriaxone and Cefotaxime are first-line agents for bacterial meningitis."}, {"num": 26, "section": "3rd Generation Cephalosporins — Neonates", "question": "In neonates (≤28 days), cefotaxime is preferred over ceftriaxone because:", "options": ["A. Ceftriaxone can displace bilirubin from albumin, risking kernicterus", "B. Cefotaxime is cheaper", "C. Ceftriaxone causes seizures in neonates", "D. Cefotaxime has broader Gram-negative coverage"], "correct": "A", "explanation": "Ceftriaxone can displace bilirubin from albumin in neonates, risking kernicterus (bilirubin encephalopathy). Therefore, cefotaxime is preferred in neonates ≤28 days old."}, {"num": 27, "section": "3rd Generation Cephalosporins", "question": "Which 3rd generation cephalosporin is active against Pseudomonas aeruginosa?", "options": ["A. Ceftriaxone", "B. Cefotaxime", "C. Ceftazidime", "D. Cefixime"], "correct": "C", "explanation": "Ceftazidime (3rd generation) is active against Pseudomonas aeruginosa, though resistance is rising."}, {"num": 28, "section": "4th Generation Cephalosporins", "question": "Cefepime (4th generation) covers all of the following EXCEPT:", "options": ["A. Streptococci", "B. MSSA", "C. MRSA", "D. Pseudomonas aeruginosa"], "correct": "C", "explanation": "Cefepime covers MSSA but NOT MRSA. It has broad-spectrum coverage including Gram-positives (Streptococci, MSSA) and Gram-negatives (Enterobacter, E. coli, K. pneumoniae, P. aeruginosa)."}, {"num": 29, "section": "5th Generation Cephalosporins", "question": "Which cephalosporin is the ONLY β-lactam effective against MRSA?", "options": ["A. Cefepime", "B. Ceftazidime", "C. Ceftaroline (binds altered PBP2a)", "D. Cefuroxime"], "correct": "C", "explanation": "Ceftaroline (5th generation) binds to altered PBP2a and is the ONLY β-lactam antibiotic effective against MRSA."}, {"num": 30, "section": "5th Generation — Cefiderocol", "question": "Cefiderocol uses a unique mechanism to enter Gram-negative bacteria. What is it?", "options": ["A. Porin channel", "B. Siderophore mechanism (iron transport entry)", "C. Diffusion through the lipid bilayer", "D. Active transport via ATPase"], "correct": "B", "explanation": "Cefiderocol uses a siderophore mechanism (iron transport) to enter Gram-negative bacteria, making it active against multidrug-resistant Gram-negatives including KPC, OXA, and MBL producers."}, {"num": 31, "section": "Cephalosporins — Resistance", "question": "Which is the primary resistance mechanism for cephalosporins?", "options": ["A. β-Lactamase hydrolysis and altered PBPs", "B. Folic acid synthesis inhibition", "C. Ribosomal mutation", "D. Cell membrane disruption"], "correct": "A", "explanation": "Cephalosporin resistance is primarily due to β-lactamase hydrolysis and altered PBPs."}, {"num": 32, "section": "Cephalosporins — Pharmacokinetics", "question": "Which cephalosporin is an exception to renal excretion (biliary excretion instead)?", "options": ["A. Cefazolin", "B. Cefuroxime", "C. Ceftriaxone", "D. Cefepime"], "correct": "C", "explanation": "Ceftriaxone is the exception among cephalosporins — it is primarily excreted via biliary excretion rather than renal excretion."}, {"num": 33, "section": "Cephalosporins — Adverse Effects", "question": "Cephalosporins have approximately what cross-reactivity rate with penicillins?", "options": ["A. 0-1%", "B. 3-5%", "C. 20-30%", "D. 50-60%"], "correct": "B", "explanation": "Cephalosporins have approximately 3-5% cross-reactivity with penicillins (allergy risk)."}, {"num": 34, "section": "Cephalosporins — Adverse Effects", "question": "Which of the following is NOT an adverse effect of cephalosporins?", "options": ["A. Allergy (~3-5% cross-reactivity with penicillins)", "B. Injection site pain", "C. Nephrotoxicity (with aminoglycosides)", "D. Hepatic fibrosis"], "correct": "D", "explanation": "Hepatic fibrosis is NOT a known adverse effect of cephalosporins. Known adverse effects include allergy, injection site pain, nephrotoxicity (with aminoglycosides), hypoprothrombinemia, and disulfiram-like reactions."}, {"num": 35, "section": "Carbapenems", "question": "Which carbapenem has the highest seizure risk?", "options": ["A. Meropenem", "B. Doripenem", "C. Ertapenem", "D. Imipenem"], "correct": "D", "explanation": "Imipenem has a higher seizure risk compared to other carbapenems. It is always given with cilastatin to prevent renal degradation by dehydropeptidase."}, {"num": 36, "section": "Carbapenems — Spectrum", "question": "Which carbapenem does NOT cover Pseudomonas aeruginosa?", "options": ["A. Imipenem", "B. Meropenem", "C. Doripenem", "D. Ertapenem"], "correct": "D", "explanation": "Ertapenem does NOT cover Pseudomonas aeruginosa, Enterococcus spp., or Acinetobacter spp. It is used for once-daily dosing."}, {"num": 37, "section": "Carbapenems — ESBL", "question": "Carbapenems are the drug of choice for infections caused by which organisms?", "options": ["A. MRSA", "B. ESBL-producing organisms", "C. Mycobacterium tuberculosis", "D. Viruses"], "correct": "B", "explanation": "Carbapenems are the drug of choice for ESBL (Extended-Spectrum β-Lactamase)-producing organisms."}, {"num": 38, "section": "Monobactams", "question": "Aztreonam is unique because it:", "options": ["A. Has a single β-lactam ring (not fused to another ring)", "B. Has two β-lactam rings fused together", "C. Is a glycopeptide antibiotic", "D. Is only effective against Gram-positive bacteria"], "correct": "A", "explanation": "Aztreonam is a unique β-lactam with a single β-lactam ring (not fused to another ring). It is active against Gram-negative bacteria only, with no activity against Gram-positives or anaerobes."}, {"num": 39, "section": "Monobactams — Safety", "question": "Aztreonam is safe for patients with penicillin allergies because:", "options": ["A. It has minimal cross-reactivity with penicillins", "B. It is a completely different class with no relationship", "C. It is administered topically only", "D. It does not cause any allergic reactions"], "correct": "A", "explanation": "Aztreonam is a safe alternative for penicillin/cephalosporin-allergic patients due to minimal cross-reactivity."}, {"num": 40, "section": "Vancomycin", "question": "Vancomycin is effective against which organisms?", "options": ["A. Gram-negative bacteria only", "B. MRSA, MRSE, Enterococcus spp., and Clostridium difficile", "C. All viruses", "D. Mycobacteria only"], "correct": "B", "explanation": "Vancomycin targets Gram-positive bacteria only and is effective against MRSA, MRSE, Enterococcus spp., and Clostridium difficile."}, {"num": 41, "section": "Vancomycin", "question": "What is the mechanism of action of vancomycin?", "options": ["A. Binds peptidoglycan precursors, preventing cell wall polymerization", "B. Inhibits protein synthesis", "C. Disrupts DNA replication", "D. Blocks folic acid synthesis"], "correct": "A", "explanation": "Vancomycin binds to peptidoglycan precursors, preventing cell wall polymerization, similar to but distinct from β-lactams."}, {"num": 42, "section": "Vancomycin — Adverse Effects", "question": "What is 'Red Man Syndrome' associated with?", "options": ["A. Rapid IV infusion of vancomycin", "B. Oral vancomycin for C. difficile", "C. Topical vancomycin", "D. Vancomycin overdose causing liver failure"], "correct": "A", "explanation": "Red Man Syndrome is an infusion-related reaction caused by rapid IV infusion of vancomycin. It must be slowly infused over 1-2 hours."}, {"num": 43, "section": "Vancomycin", "question": "Why is oral vancomycin used for C. difficile infection?", "options": ["A. It is absorbed systemically and reaches the colon", "B. It is NOT absorbed systemically (local action in the gut)", "C. It is more effective IV than oral", "D. It is the only antibiotic that can be given orally"], "correct": "B", "explanation": "Oral vancomycin is used for C. difficile infection because it is not absorbed systemically, providing local action in the gut."}, {"num": 44, "section": "Vancomycin — Resistance", "question": "Emerging resistance to vancomycin includes which organisms?", "options": ["A. MRSA, MRSE", "B. VRE, VISA, VRSA", "C. E. coli, K. pneumoniae", "D. Pseudomonas aeruginosa"], "correc // Build filter buttons
const sections = [...new Set(questions.map(q => q.section.split(' — ')[0]))];
const filterBar = document.getElementById('filterBar');

function createFilterBtn(sec, isAll) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (isAll ? ' active' : '');
    btn.textContent = sec;
    btn.dataset.sec = sec;
    btn.addEventListener('click', function() {
        filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderQuestions(sec);
    });
    return btn;
}
filterBar.appendChild(createFilterBtn('All Sections', true));
sections.forEach(sec => filterBar.appendChild(createFilterBtn(sec, false)));

let currentFilter = 'all';
let userAnswers = {};

function renderQuestions(filter) {
    filter = filter || 'all';
    currentFilter = filter;
    const area = document.getElementById('quizArea');
    area.innerHTML = '';
    const filtered = filter === 'all' ? questions : questions.filter(q => q.section.startsWith(filter));
    document.getElementById('totalCount').textContent = filtered.length;
    document.getElementById('totalQ').textContent = filtered.length;
    document.getElementById('results').style.display = 'none';

    filtered.forEach(q => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = 'q' + q.num;

        const header = document.createElement('div');
        header.className = 'q-header';
        const badge = document.createElement('div');
        badge.className = 'q-badge';
        badge.textContent = q.num;
        const info = document.createElement('div');
        info.className = 'q-info';
        const secDiv = document.createElement('div');
        secDiv.className = 'q-section';
        secDiv.textContent = q.section;
        const qDiv = document.createElement('div');
        qDiv.className = 'q-text';
        qDiv.textContent = q.question;
        info.appendChild(secDiv);
        info.appendChild(qDiv);
        header.appendChild(badge);
        header.appendChild(info);

        const list = document.createElement('ul');
        list.className = 'options-list';
        q.options.forEach(opt => {
            const li = document.createElement('li');
            li.className = 'opt';
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'q' + q.num;
            input.value = opt[0];
            input.id = 'q' + q.num + '_' + opt[0];
            input.addEventListener('change', function() {
                selectAnswer(this, q.correct, q.num);
            });
            const label = document.createElement('label');
            label.setAttribute('for', 'q' + q.num + '_' + opt[0]);
            label.textContent = opt;
            label.style.cursor = 'pointer';
            label.style.flex = '1';
            li.appendChild(input);
            li.appendChild(label);
            list.appendChild(li);
        });

        const answerBox = document.createElement('div');
        answerBox.className = 'answer-box';
        answerBox.id = 'answer' + q.num;
        const h4 = document.createElement('h4');
        const expl = document.createElement('div');
        expl.className = 'explanation';
        expl.textContent = q.explanation;
        answerBox.appendChild(h4);
        answerBox.appendChild(expl);

        card.appendChild(header);
        card.appendChild(list);
        card.appendChild(answerBox);
        area.appendChild(card);
    });
    updateScore();
}

function selectAnswer(input, correct, qNum) {
    // Highlight selected
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('checked'));
    input.closest('.opt').classList.add('checked');
    // Show answer
    const box = document.getElementById('answer' + qNum);
    const h4 = box.querySelector('h4');
    const letter = input.value;
    if (letter === correct) {
        h4.textContent = '✅ Correct!';
        input.closest('.opt').classList.add('correct-opt');
    } else {
        h4.textContent = '❌ Wrong — Correct answer: ' + correct;
        input.closest('.opt').classList.add('wrong-opt');
        // Highlight correct option
        document.querySelectorAll('.opt').forEach(o => {
            const inp = o.querySelector('input');
            if (inp && inp.value === correct) {
                o.classList.add('correct-opt');
            }
        });
    }
    box.classList.add('show');
    userAnswers[qNum] = letter;
    updateScore();
}

function updateScore() {
    let correct = 0, answered = 0;
    questions.forEach(q => {
        if (userAnswers[q.num]) {
            answered++;
            if (userAnswers[q.num] === q.correct) correct++;
        }
    });
    document.getElementById('score').textContent = correct;
    document.getElementById('answered').textContent = answered;
    const total = parseInt(document.getElementById('totalQ').textContent);
    if (answered === total && total > 0) {
        document.getElementById('finalScore').textContent = correct + '/' + total;
        const msg = correct === total ? '🎉 Perfect score! You are a pharmacology master!' :
                    correct >= Math.ceil(total * 0.7) ? '✅ Great job! Review explanations for any missed questions.' :
                    '📚 Keep studying! Review the explanations for each question.';
        document.getElementById('scoreMsg').textContent = msg;
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({behavior: 'smooth'});
    } else {
        document.getElementById('results').style.display = 'none';
    }
}

function resetQuiz() {
    userAnswers = {};
    document.querySelectorAll('input[type=radio]').forEach(r => r.checked = false);
    document.querySelectorAll('.opt').forEach(o => { o.classList.remove('checked'); o.classList.remove('correct-opt'); o.classList.remove('wrong-opt'); });
    document.querySelectorAll('.answer-box').forEach(a => a.classList.remove('show'));
    document.getElementById('results').style.display = 'none';
    const filter = currentFilter;
    renderQuestions(filter);
    // Restore filter button state
    filterBar.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sec === filter);
    });
}

renderQuestions('all');
</script>
